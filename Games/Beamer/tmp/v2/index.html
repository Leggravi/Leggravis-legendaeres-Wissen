<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wikinger Spieleabend v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
       CSS VARIABLEN – NORDLICHT-THEME
    ═══════════════════════════════════════════ */
    :root {
      --bg-deep:       #04080f;
      --bg-mid:        #080e1a;
      --bg-card:       rgba(10, 18, 35, 0.85);
      --aurora-blue:   #00d4ff;
      --aurora-purple: #c084fc;
      --aurora-pink:   #f472b6;
      --aurora-green:  #34d399;
      --gold:          #fbbf24;
      --text-bright:   #f0f4ff;
      --text-mid:      #94a3b8;
      --text-dim:      #475569;
      --border:        rgba(148, 163, 184, 0.12);
      --glow-blue:     0 0 20px rgba(0, 212, 255, 0.4), 0 0 40px rgba(0, 212, 255, 0.15);
      --glow-purple:   0 0 20px rgba(192, 132, 252, 0.4), 0 0 40px rgba(192, 132, 252, 0.15);
      --glow-pink:     0 0 20px rgba(244, 114, 182, 0.4), 0 0 40px rgba(244, 114, 182, 0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cinzel', serif;
      background: var(--bg-deep);
      color: var(--text-bright);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #aurora-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 8%,  rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 22%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 35%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 12%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 75%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 48% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 62% 70%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 58%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 5% 90%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 20% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 35% 92%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 50% 82%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 65% 88%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 80% 93%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 95% 72%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 8% 30%, rgba(200,220,255,0.8) 0%, transparent 100%),
        radial-gradient(2px 2px at 42% 45%, rgba(200,220,255,0.6) 0%, transparent 100%),
        radial-gradient(2px 2px at 73% 20%, rgba(200,220,255,0.7) 0%, transparent 100%),
        radial-gradient(2px 2px at 90% 50%, rgba(200,220,255,0.5) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 1200px;
      padding: 2em 1.5em 4em;
      position: relative;
      z-index: 1;
      text-align: center;
      animation: fadeUp 0.5s ease forwards;
    }
    .screen.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-title {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(1.6em, 5vw, 3.2em);
      font-weight: 900;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--aurora-blue) 0%, var(--aurora-purple) 50%, var(--aurora-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(192, 132, 252, 0.5));
      margin-bottom: 0.2em;
    }
    .page-subtitle {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 1em;
      color: var(--text-mid);
      letter-spacing: 0.1em;
      margin-bottom: 1.5em;
    }
    .section-title {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(1em, 3vw, 1.6em);
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 0.8em;
      text-shadow: var(--glow-purple);
    }

    .rune-divider {
      display: flex;
      align-items: center;
      gap: 0.8em;
      margin: 1em 0;
      color: var(--text-dim);
      font-size: 1.1em;
      letter-spacing: 0.3em;
    }
    .rune-divider::before, .rune-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .btn {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.9em;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.75em 2em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(0,212,255,0.15) 0%, rgba(192,132,252,0.2) 100%);
      border: 1px solid rgba(192, 132, 252, 0.5);
      color: var(--text-bright);
      box-shadow: var(--glow-purple), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(0,212,255,0.25) 0%, rgba(192,132,252,0.35) 100%);
      box-shadow: var(--glow-purple), 0 0 60px rgba(192,132,252,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-mid);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text-bright);
      border-color: rgba(148,163,184,0.3);
    }
    .btn-danger {
      background: rgba(244, 114, 182, 0.1);
      border: 1px solid rgba(244, 114, 182, 0.3);
      color: var(--aurora-pink);
    }
    .btn-danger:hover {
      background: rgba(244, 114, 182, 0.2);
      box-shadow: var(--glow-pink);
    }
    .btn-gold {
      background: linear-gradient(135deg, rgba(251,191,36,0.2) 0%, rgba(251,191,36,0.1) 100%);
      border: 1px solid rgba(251,191,36,0.5);
      color: var(--gold);
      box-shadow: 0 0 20px rgba(251,191,36,0.2);
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, rgba(251,191,36,0.3) 0%, rgba(251,191,36,0.15) 100%);
      box-shadow: 0 0 30px rgba(251,191,36,0.4);
      transform: translateY(-2px);
    }

    .btn-group {
      display: flex;
      gap: 0.8em;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.5em;
    }

    .team-inputs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1em;
      margin: 1.5em 0;
    }
    .team-input-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.4em;
    }
    .team-input-label {
      font-size: 0.7em;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-mid);
    }
    .team-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.7em 1em;
      font-family: 'Cinzel', serif;
      font-size: 0.9em;
      color: var(--text-bright);
      text-align: center;
      transition: all 0.2s;
      width: 100%;
    }
    .team-input::placeholder { color: var(--text-dim); }
    .team-input:focus {
      outline: none;
      border-color: rgba(192,132,252,0.6);
      box-shadow: 0 0 15px rgba(192,132,252,0.2);
      background: rgba(192,132,252,0.07);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1.2em;
      margin: 1.5em 0;
    }

    .game-tile {
      aspect-ratio: 1;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s ease;
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      padding: 1em;
    }
    .game-tile::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--tile-gradient, linear-gradient(135deg, rgba(0,212,255,0.1), rgba(192,132,252,0.15)));
      opacity: 0;
      transition: opacity 0.3s;
    }
    .game-tile:hover::before { opacity: 1; }
    .game-tile:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: rgba(192,132,252,0.4);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), var(--glow-purple);
    }
    .game-tile .tile-rune {
      font-size: 2.2em;
      line-height: 1;
      filter: drop-shadow(0 0 8px currentColor);
    }
    .game-tile .tile-name {
      font-family: 'Cinzel', serif;
      font-size: 0.72em;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-bright);
      line-height: 1.3;
    }
    .game-tile.used {
      opacity: 0.28;
      cursor: not-allowed;
      pointer-events: none;
      filter: grayscale(0.8);
    }
    .game-tile.used::after {
      content: '✦';
      position: absolute;
      font-size: 2em;
      color: var(--text-dim);
    }

    .tile-blue   { --tile-gradient: linear-gradient(135deg, rgba(0,212,255,0.12), rgba(0,212,255,0.06)); }
    .tile-purple { --tile-gradient: linear-gradient(135deg, rgba(192,132,252,0.15), rgba(192,132,252,0.06)); }
    .tile-pink   { --tile-gradient: linear-gradient(135deg, rgba(244,114,182,0.12), rgba(244,114,182,0.06)); }
    .tile-green  { --tile-gradient: linear-gradient(135deg, rgba(52,211,153,0.12), rgba(52,211,153,0.06)); }
    .tile-gold   { --tile-gradient: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(251,191,36,0.06)); }

    .leaderboard-mini {
      display: flex;
      justify-content: center;
      gap: 1.2em;
      flex-wrap: wrap;
      margin: 1.5em 0;
    }
    .lb-chip {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4em 1em;
      font-size: 0.75em;
      letter-spacing: 0.08em;
      color: var(--text-mid);
      transition: all 0.3s;
    }
    .lb-chip.leading {
      border-color: rgba(251,191,36,0.5);
      color: var(--gold);
      box-shadow: 0 0 15px rgba(251,191,36,0.15);
    }

    .game-screen-inner {
      max-width: 700px;
      margin: 0 auto;
    }
    .game-title-display {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(1.2em, 4vw, 2.2em);
      font-weight: 700;
      margin-bottom: 0.2em;
      background: linear-gradient(135deg, var(--aurora-blue), var(--aurora-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .game-rune-display {
      font-size: 4em;
      margin: 0.3em 0;
      filter: drop-shadow(0 0 20px rgba(192,132,252,0.6));
      animation: runeGlow 3s ease-in-out infinite;
    }
    @keyframes runeGlow {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(192,132,252,0.4)); }
      50%       { filter: drop-shadow(0 0 30px rgba(192,132,252,0.8)) drop-shadow(0 0 60px rgba(0,212,255,0.3)); }
    }
    .game-thematic {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      color: var(--text-mid);
      font-size: 0.95em;
      line-height: 1.7;
      margin: 1em 0;
      padding: 1em 1.5em;
      border-left: 2px solid rgba(192,132,252,0.3);
      text-align: left;
    }
    .game-rules {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.2em;
      text-align: left;
      font-size: 0.85em;
      line-height: 1.8;
      color: var(--text-mid);
      margin: 1em 0;
    }

    .score-inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
      margin: 1.5em 0;
    }
    .score-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1em 1.5em;
      min-width: 150px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .score-item:hover { border-color: rgba(0,212,255,0.4); }
    .score-item .si-name { font-size: 0.75em; color: var(--text-mid); letter-spacing: 0.1em; margin-bottom: 0.4em; }
    .score-item .si-score {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 2em;
      color: var(--aurora-blue);
      text-shadow: var(--glow-blue);
    }
    .score-item.winner-pick {
      border-color: rgba(251,191,36,0.6);
      background: rgba(251,191,36,0.07);
    }
    .score-item.winner-pick .si-score { color: var(--gold); text-shadow: 0 0 20px rgba(251,191,36,0.4); }

    @media (max-width: 600px) {
      .game-grid { grid-template-columns: repeat(3, 1fr); gap: 0.7em; }
      .game-tile .tile-rune { font-size: 1.6em; }
      .game-tile .tile-name { font-size: 0.62em; }
      .final-podium { gap: 0.6em; }
    }
  </style>
</head>
<body>

<canvas id="aurora-canvas"></canvas>

<!-- ═══════════════ SCREEN: TEAMS ═══════════════ -->
<div id="screen-teams" class="screen visible">
  <div style="padding-top:2em">
    <div class="page-title">⚔ Wikinger-Spieleabend ⚔</div>
    <div class="page-subtitle">Möge Odin euch Stärke verleihen</div>
    <div class="rune-divider">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div>
    <div class="section-title">Clan-Namen</div>
    <div class="team-inputs-grid" id="teamInputs"></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="startGame()">⚔ Zur Feldschlacht ⚔</button>
    </div>
  </div>
</div>

<!-- ═══════════════ SCREEN: SPIELAUSWAHL ═══════════════ -->
<div id="screen-games" class="screen">
  <div class="page-title">Wählt euer Schicksal</div>
  <div class="game-grid" id="gameGrid"></div>
  <div id="leaderboardMini" class="leaderboard-mini"></div>
  <div class="btn-group">
    <button class="btn btn-danger" onclick="showFinalScreen()">Zur Siegerehrung →</button>
  </div>
</div>

<!-- ═══════════════ SCREEN: AKTUELLES SPIEL ═══════════════ -->
<div id="screen-current" class="screen">
  <div class="game-screen-inner">
    <div class="game-rune-display" id="currentGameRune">ᚱ</div>
    <div class="game-title-display" id="currentGameTitle">Spiel</div>
    <div class="game-thematic" id="currentGameThematic"></div>
    <div class="game-rules" id="currentGameRules"></div>
    <div id="gameTypeUI"></div>
    <div class="rune-divider" style="margin:1.5em 0">ᚦ ᚨ ᚱ</div>
    <div class="section-title" style="font-size:0.9em; color:var(--text-mid)">Punkte vergeben</div>
    <div class="score-inputs" id="scoreInputs"></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="confirmScores()">Weiter →</button>
      <button class="btn btn-secondary" onclick="showScreen('screen-games')">↩ Zurück</button>
    </div>
  </div>
</div>

<!-- ═══════════════ SCREEN: FINALE ═══════════════ -->
<div id="screen-final" class="screen">
  <div class="page-title" id="finalWinnerName">⚔ SIEGER ⚔</div>
  <div class="page-subtitle">Ruhmreich in Walhalla verewigt</div>
  <div class="rune-divider">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="restartGame()">↩ Neues Spiel</button>
  </div>
</div>

<script src="../js/buzzer.js"></script>
<script>
// ═══════════════════════════════════════════
//  SPIEL-KONFIGURATION
// ═══════════════════════════════════════════

const GAMES = [
  // ORIGINAL SPIELE (mit Buzzer & 3 Teams angepasst)
  {
    name: "Die Bergung",
    rune: "ᚱ",
    tileColor: "tile-blue",
    thematic: "Nach einem schweren Sturm sind Gegenstände am Strand verteilt. Die flinksten Kundschafter müssen sie bergen!",
    rules: "Moderator: Gegenstand ausrufen. Teams drücken Tasten 1, 2, 3. Wer zuerst buzzert UND den Gegenstand bringt, gewinnt! 3 Runden.",
    type: "buzzer"
  },
  {
    name: "Der Schmied",
    rune: "ᚺ",
    tileColor: "tile-pink",
    thematic: "Das Dorf braucht Schilde! Wer schlägt am meisten auf den Amboss?",
    rules: "60 Sekunden Zeit. Teams drücken so oft wie möglich. Wer am meisten Drücke hat, gewinnt!",
    type: "counter"
  },
  {
    name: "Das Ankertau",
    rune: "ᚾ",
    tileColor: "tile-green",
    thematic: "Tauziehen zwischen den Clans! Das Drachenboot muss in den Hafen gezogen werden.",
    rules: "Zwei Teams halten das Seil. Wer zuerst Buzzer drückt, zieht stärker. Pro Match: 5 Sekunden. 3 Teams = 3 Matches!",
    type: "timer"
  },
  {
    name: "Die Mutprobe",
    rune: "ᛜ",
    tileColor: "tile-gold",
    thematic: "Feuriges Gewürz aus fernen Landen. Nur wer einen starken Magen hat, besteht diese Probe!",
    rules: "Moderator: Tabasco ins OJ geben. Spieler trinken reihum. Wer nicht mehr kann: Buzzer drücken! Letzte Runde zählt.",
    type: "moderiert"
  },
  {
    name: "Der Fjordkurs",
    rune: "ᛚ",
    tileColor: "tile-blue",
    thematic: "Der Steuermann muss den Befehl in der exakten Sekunde geben, sonst sinkt das Schiff!",
    rules: "Moderator: Timer läuft. Jedes Team versucht, auf 30 Sekunden genau zu stoppen. Wer am nächsten dran, gewinnt!",
    type: "precision"
  },
  {
    name: "Rat der Ältesten",
    rune: "ᚨ",
    tileColor: "tile-purple",
    thematic: "Ein guter Anführer braucht einen wachen Verstand! Knifflige Fragen der Ältesten.",
    rules: "Moderator liest Frage vor. Teams drücken Tasten 1-3 zum Buzzern. Schnellste antwortet. Richtig = 1 Punkt!",
    type: "quiz"
  },
  {
    name: "Der Schildwall",
    rune: "ᛞ",
    tileColor: "tile-pink",
    thematic: "Wandsitzen – die Stellung muss gehalten werden! Wer hat die längsten Beine?",
    rules: "Jedes Team: Ein Spieler sitzt an der Wand (90° Winkel). Wer nicht mehr kann, buzzert. Längste Zeit gewinnt!",
    type: "endurance"
  },
  {
    name: "Die eiserne Ration",
    rune: "ᛖ",
    tileColor: "tile-green",
    thematic: "Ein Keks auf der Stirn – nur mit Kopfbewegungen in den Mund! Keine Hände!",
    rules: "Ein Spieler pro Team. Keks auf Stirn. Nur Kopf/Gesicht bewegen. Wer schafft es zuerst, ohne dass Keks fällt?",
    type: "timer"
  },

  // 3 NEUE JOKER-SPIELE ✨
  {
    name: "✨ Wahl der Götter",
    rune: "✨",
    tileColor: "tile-gold",
    thematic: "[GEHEIM] Die Götter haben entschieden – dieses Clan erhält einen direkten Punkt!",
    rules: "Das Team, das dieses Spiel wählt, gewinnt automatisch! Keine Spielregeln – einfach Punkt kassieren!",
    type: "joker"
  },
  {
    name: "✨ Odin's Gnade",
    rune: "✨",
    tileColor: "tile-gold",
    thematic: "[GEHEIM] Odin schenkt dem mutigen Clan einen Punkt aus reiner Gnade!",
    rules: "Das Team, das dieses Spiel wählt, gewinnt automatisch! Keine Spielregeln – einfach Punkt kassieren!",
    type: "joker"
  },
  {
    name: "✨ Wahl des Schicksals",
    rune: "✨",
    tileColor: "tile-gold",
    thematic: "[GEHEIM] Das Schicksal ist entschieden – dieser Clan hat gewonnen!",
    rules: "Das Team, das dieses Spiel wählt, gewinnt automatisch! Keine Spielregeln – einfach Punkt kassieren!",
    type: "joker"
  }
];

// ═══════════════════════════════════════════
//  ZUSTAND
// ═══════════════════════════════════════════
let teams = ['Team 1', 'Team 2', 'Team 3'];
let scores = [0, 0, 0];
let usedGames = [];
let currentGameIdx = null;

// ═══════════════════════════════════════════
//  NORD LICHT-ANIMATION
// ═══════════════════════════════════════════
const canvas = document.getElementById('aurora-canvas');
const ctx = canvas.getContext('2d');
let t = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawAurora() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  t += 0.003;

  const bands = [
    { hue: 180, y: 0.10, amp: 0.07, freq: 0.6, alpha: 0.30 },
    { hue: 270, y: 0.14, amp: 0.06, freq: 0.9, alpha: 0.25 },
    { hue: 320, y: 0.20, amp: 0.05, freq: 1.1, alpha: 0.20 },
  ];

  bands.forEach((band) => {
    ctx.beginPath();
    for (let i = 0; i <= 80; i++) {
      const x = (i / 80) * w;
      const y = band.y * h + Math.sin(i * band.freq * 0.12 + t) * band.amp * h;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    for (let i = 80; i >= 0; i--) {
      const x = (i / 80) * w;
      const y = band.y * h + Math.sin(i * band.freq * 0.12 + t) * band.amp * h + h * 0.18;
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, 0, h * 0.5);
    grad.addColorStop(0, `hsla(${band.hue},90%,65%,${band.alpha})`);
    grad.addColorStop(1, `hsla(${band.hue},70%,45%,0)`);
    ctx.fillStyle = grad;
    ctx.fill();
  });

  requestAnimationFrame(drawAurora);
}
drawAurora();

// ═══════════════════════════════════════════
//  SCREEN-MANAGEMENT
// ═══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('visible'));
  document.getElementById(id).classList.add('visible');
  window.scrollTo(0, 0);
  buzzerCallback = null;
}

// ═══════════════════════════════════════════
//  TEAM-SETUP
// ═══════════════════════════════════════════
function initTeams() {
  const container = document.getElementById('teamInputs');
  container.innerHTML = '';
  teams.forEach((team, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'team-input-wrap';
    wrap.innerHTML = `
      <div class="team-input-label">Clan ${i + 1}</div>
      <input class="team-input" type="text" id="team${i}" value="${team}" maxlength="20">
    `;
    container.appendChild(wrap);
  });
}

function startGame() {
  teams.forEach((_, i) => {
    teams[i] = document.getElementById(`team${i}`).value || `Team ${i + 1}`;
  });
  scores = [0, 0, 0];
  usedGames = [];
  currentGameIdx = null;
  renderGameGrid();
  renderLeaderboard();
  showScreen('screen-games');
}

// ═══════════════════════════════════════════
//  SPIEL-AUSWAHL
// ═══════════════════════════════════════════
function renderGameGrid() {
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';
  GAMES.forEach((game, idx) => {
    const tile = document.createElement('div');
    tile.className = `game-tile ${game.tileColor}`;
    if (usedGames.includes(idx)) {
      tile.classList.add('used');
    } else {
      tile.onclick = () => selectGame(idx);
    }
    tile.innerHTML = `
      <div class="tile-rune">${game.rune}</div>
      <div class="tile-name">${game.name}</div>
    `;
    grid.appendChild(tile);
  });
}

function renderLeaderboard() {
  const container = document.getElementById('leaderboardMini');
  container.innerHTML = '';
  const maxScore = Math.max(...scores);
  teams.forEach((team, i) => {
    const chip = document.createElement('div');
    chip.className = 'lb-chip' + (scores[i] === maxScore && maxScore > 0 ? ' leading' : '');
    chip.textContent = `${team}: ${scores[i]}`;
    container.appendChild(chip);
  });
}

function selectGame(idx) {
  const game = GAMES[idx];
  usedGames.push(idx);
  currentGameIdx = idx;
  
  document.getElementById('currentGameRune').textContent = game.rune;
  document.getElementById('currentGameTitle').textContent = game.name;
  document.getElementById('currentGameThematic').textContent = game.thematic;
  document.getElementById('currentGameRules').textContent = game.rules;
  
  // Spieltyp-spezifisches UI
  const ui = document.getElementById('gameTypeUI');
  ui.innerHTML = '';
  
  if (game.type === 'joker') {
    // Joker: Automatischer Sieg
    ui.innerHTML = `<div style="font-size:1.5em; color:var(--gold); margin:2em 0">🎉 Dieser Clan gewinnt automatisch! 🎉</div>`;
  } else if (game.type === 'counter') {
    ui.innerHTML = `<div style="text-align:center; font-size:1.2em; color:var(--aurora-blue); margin:1.5em 0">⏱️ 60 Sekunden – Wer drückt am meisten?</div>`;
  } else if (game.type === 'precision') {
    ui.innerHTML = `<div style="text-align:center; font-size:1.2em; color:var(--aurora-blue); margin:1.5em 0">⏱️ Stoppe den Timer so nah wie möglich an 30 Sekunden!</div>`;
  } else if (game.type === 'moderiert') {
    ui.innerHTML = `<div style="text-align:center; font-size:1.2em; color:var(--text-mid); margin:1.5em 0; font-style:italic">Moderiert: Spielt nach den Regeln oben. Moderator kontrolliert!</div>`;
  }

  renderScoreInputs();
  showScreen('screen-current');
}

// ═══════════════════════════════════════════
//  SCORE-EINGABE
// ═══════════════════════════════════════════
function renderScoreInputs() {
  const container = document.getElementById('scoreInputs');
  container.innerHTML = '';
  teams.forEach((team, i) => {
    const item = document.createElement('div');
    item.className = 'score-item';
    item.id = `si_${i}`;
    item.innerHTML = `
      <div class="si-name">${team}</div>
      <div class="si-score" id="siscore_${i}">${scores[i]}</div>
      <div style="font-size:0.65em; color:var(--text-dim); margin-top:0.3em">Klick +1 Punkt</div>
    `;
    item.onclick = () => {
      scores[i] += 1;
      document.getElementById(`siscore_${i}`).textContent = scores[i];
      item.classList.add('winner-pick');
    };
    container.appendChild(item);
  });
}

function confirmScores() {
  renderLeaderboard();
  showScreen('screen-games');
}

// ═══════════════════════════════════════════
//  FINALE
// ═══════════════════════════════════════════
function showFinalScreen() {
  const maxIdx = scores.indexOf(Math.max(...scores));
  document.getElementById('finalWinnerName').textContent = `⚔ ${teams[maxIdx]} ⚔`;
  showScreen('screen-final');
}

function restartGame() {
  showScreen('screen-teams');
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
initTeams();
</script>

</body>
</html>
